<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خزنتي</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;padding:20px;text-align:center}
.box{background:#1e293b;padding:20px;border-radius:15px;margin-top:20px}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px}
button{background:#22c55e;color:white;font-weight:bold}
h1{color:#22c55e}
</style>
</head>
<body>
<h1>خزنتي 💰</h1>
<div class="box">
<input id="name" placeholder="سمية الفلوس (مثال: العيد)">
<input id="amount" type="number" placeholder="شحال (مثال: 500)">
<button onclick="add()">زيد الخزنة</button>
<div id="list" style="margin-top:20px"></div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('khazna')||'[]');
function show(){let h='';let total=0;data.forEach((d,i)=>{total+=+d.amount;h+=`<div style="background:#334155;padding:10px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between"><span>${d.name}: ${d.amount} DH</span><span onclick="del(${i})" style="color:red">X</span></div>`});h+=`<h2>المجموع: ${total} DH</h2>`;document.getElementById('list').innerHTML=h;localStorage.setItem('khazna',JSON.stringify(data))}
function add(){let n=document.getElementById('name').value;let a=document.getElementById('amount').value;if(!n||!a)return alert('عمر المعلومات');data.push({name:n,amount:a});show();document.getElementById('name').value='';document.getElementById('amount').value='';}
function del(i){data.splice(i,1);show();}
show();
</script>
</body>
</html>
